# The suite is one file, has no dependencies and makes no external network calls, so CI is the
# whole story: check out, run it. Node 18 is the floor the app declares (it needs global fetch);
# 20 and 22 guard against something newer breaking on an older runtime and nobody noticing.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No `npm ci`: package.json declares zero dependencies and there is no lockfile to install
      # from. Adding an install step here would only invent a way for CI to fail.
      - run: node test.js

  # The Paseo plugin is TypeScript with dev-only dependencies (types), unlike the app. Its tests run
  # straight from .ts through Node's type stripping, unflagged from 22.18. check:bundle needs the
  # Paseo desktop app's compiler, so it stays a local check.
  paseo-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paseo-plugin
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only that the image builds. Running it in CI would prove little: the container's whole
      # point is reaching a host ~/.claude that a runner does not have.
      - run: docker build -t llmswapper:ci .
